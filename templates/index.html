
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask POST Method</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <div class="container">
        <h1>Form Input Flask</h1>

        <form method="POST" action="/">
            <label for="nama">Masukkan Nama:</label>

            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama kamu"
                required
            >

            <button type="submit">Kirim Data</button>
        </form>

        <div class="hasil">
            <label>Hasil:</label>
            <p>{{ hasil }}</p>
        </div>
    </div>

</body>
</html>
